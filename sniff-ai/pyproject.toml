[project]
name = "sniff"
version = "0.1.0"
description = "Autonomous QA system that simulates real user behaviour to continuously test signup and onboarding flows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Abbas Ali Sariya", email = "abbasalisariya@example.com"}
]
maintainers = [
    {name = "Abbas Ali Sariya", email = "abbasalisariya@example.com"}
]
keywords = [
    "testing",
    "automation",
    "ai",
    "signup-flow",
    "onboarding-testing",
    "autonomous-qa",
    "playwright",
    "aws-bedrock",
    "typesafe-ai",
    "qa",
    "mobile-testing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # CLI framework — v0.27+ uses annotated-style decorators
    "typer>=0.27.0",
    # Terminal formatting — v15 added new color system; no breaking changes for our usage
    "rich>=15.0.0",
    # Interactive CLI prompts
    "questionary>=2.0.1",
    # Data validation — v2.13 is latest stable with significant performance improvements
    "pydantic>=2.13.0",
    # Browser automation — v1.63 adds improved mobile emulation and network interception
    "playwright>=1.63.0",
    # Vertex AI Gemini SDK — Tier 3 vision-capable reasoning (replaces Bedrock)
    "google-genai>=2.25,<3",
    # Google Cloud auth (Application Default Credentials) for Vertex AI
    "google-auth>=2.35.0",
    # OpenAI-compatible client — used for k2-horizon (ifm.ai), Tier 3 text-only reasoning
    "openai>=1.50.0",
    # HTTP client for Slack webhooks and Jev (Typesafe AI) API
    "httpx>=0.28.0",
    # .env file loading
    "python-dotenv>=1.0.0",
    # Image processing for screenshot compression
    "Pillow>=11.0.0",
    # Supabase cloud storage integration
    "supabase>=2.31.0",
    # Scheduler daemon for continuous runs (ADR-003)
    "apscheduler>=3.11.0",
    # FastAPI for webhook trigger endpoint in scheduler
    "fastapi>=0.115.0",
    # ASGI server for scheduler webhook (lightweight)
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    # Test framework — v9 has improved output and fixtures
    "pytest>=9.1.0",
    # Async test support for Playwright worker tests
    "pytest-asyncio>=1.4.0",
    # Code formatting
    "black>=25.0.0",
    # Linting — v0.16 has significant performance improvements
    "ruff>=0.16.0",
    # Type checking
    "mypy>=1.15.0",
]
all = [
    "sniff[dev]",
]

[project.urls]
Homepage = "https://github.com/abbasalisariya/sniff"
Documentation = "https://github.com/abbasalisariya/sniff#readme"
Repository = "https://github.com/abbasalisariya/sniff"
Issues = "https://github.com/abbasalisariya/sniff/issues"

[project.scripts]
sniff = "src.cli.main:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
"src.personas" = ["*.json"]

[tool.pytest.ini_options]
# Add repo root to Python path so `from src.xxx import yyy` works in tests.
# Decision: pythonpath = ["."] is the recommended pytest approach over conftest.py
# sys.path manipulation for clean, explicit path configuration.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
